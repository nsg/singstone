[advisories]
# Temporary ignores (added 2026-10-19). Anyone touching dependencies or this
# file: check whether they are still needed, and if not, bump and delete them.
#
# zip 2.4.2 is only a build dependency of sherpa-onnx-sys 1.13.8, whose build
# script extracts a zip archive solely when it downloads prebuilt iOS libraries.
# SHERPA_ONNX_LIB_DIR is always set (.cargo/config.toml, snap/snapcraft.yaml),
