# zstd-safe 7, which reach the build only through that unused path (ignores
# added 2026-10-26). Upstream moved to zip 9 in k2-fsa/sherpa-onnx#4059
# (commit 1a9d234), released in sherpa-onnx-sys 2.0.0: bump sherpa-onnx
# (Cargo.toml, Cargo.lock, the sherpa-onnx source-commit in
# snap/snapcraft.yaml, docs/dependencies.md), verify diarization still works,
# and remove these entries.
