# Native sherpa-onnx libraries must be supplied locally; the sherpa-onnx-sys
# build script would otherwise download unverified binaries at build time.
# Populate third_party/sherpa-onnx/lib with scripts/fetch-sherpa-onnx.sh.
[env]
SHERPA_ONNX_LIB_DIR = { value = "third_party/sherpa-onnx/lib", relative = true }
