name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Formatting and RustSec audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - run: cargo fmt --check

      - name: Test Intel GPU launcher selection
        run: scripts/test-sycl-launcher.sh

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install --locked cargo-audit

      - run: cargo audit

      - name: Pack GNOME Shell extension
        run: scripts/pack-gnome-extension.sh

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: singstone-gnome-shell-extension
          path: dist/singstone-gnome-shell-extension.zip
          if-no-files-found: error
          retention-days: 7

  snap:
    name: Build snap
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Snapcraft
        run: |
          for attempt in {1..10}; do
            if sudo snap install snapcraft --classic; then
              exit 0
            fi
            if (( attempt < 10 )); then
              echo "Snap Store unavailable (attempt $attempt of 10); retrying" >&2
              sleep 30
            fi
          done
          exit 1

      - name: Compute ONNX Runtime cache key
        id: onnxruntime-cache-key
        run: |
          recipe_hash=$(
            ruby -ryaml -rjson -rdigest -e '
              project = YAML.safe_load_file("snap/snapcraft.yaml", aliases: true)
              payload = {
                "base" => project.fetch("base"),
                "platforms" => project.fetch("platforms"),
                "part" => project.fetch("parts").fetch("onnxruntime"),
              }
              print Digest::SHA256.hexdigest(JSON.generate(payload))
            '
          )
          snapcraft_revision=$(snap list snapcraft | awk '$1 == "snapcraft" {print $3}')
          test -n "$recipe_hash"
          test -n "$snapcraft_revision"
          printf 'key=onnxruntime-build-v1-%s-%s-snapcraft-%s-%s\n' \
            '${{ runner.os }}' '${{ runner.arch }}' \
            "$snapcraft_revision" "$recipe_hash" >> "$GITHUB_OUTPUT"

      - name: Restore ONNX Runtime build cache
        id: onnxruntime-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            parts/onnxruntime/install
            parts/onnxruntime/state/pull
            parts/onnxruntime/state/build
          key: ${{ steps.onnxruntime-cache-key.outputs.key }}

      - name: Build ONNX Runtime
        run: sudo snapcraft build onnxruntime --destructive-mode

      - name: Validate ONNX Runtime cache payload
        run: |
          test -f parts/onnxruntime/install/lib/libonnxruntime.so.1.28.2
          test -f parts/onnxruntime/state/pull
          test -f parts/onnxruntime/state/build
          sudo chown -R "$USER:$USER" \
            parts/onnxruntime/install \
            parts/onnxruntime/state

      - name: Save ONNX Runtime build cache
        if: steps.onnxruntime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            parts/onnxruntime/install
            parts/onnxruntime/state/pull
            parts/onnxruntime/state/build
          key: ${{ steps.onnxruntime-cache-key.outputs.key }}

      - name: Build and pack remaining snap
        run: |
          sudo snapcraft pack --destructive-mode
          sudo chown "$USER:$USER" ./*.snap

      - name: Verify Intel SYCL payload
        run: |
          snap_path=$(find . -maxdepth 1 -type f -name '*.snap' -print -quit)
          test -n "$snap_path"
          file_list=$(unsquashfs -l "$snap_path")
          for payload in \
            bin/singstone \
            bin/singstone-launcher \
            bin/singstone-sycl \
            bin/singstone-sycl-probe \
            etc/OpenCL/vendors/intel.icd \
            lib/libggml-sycl.so \
            lib/libmkl_sycl_blas.so \
            lib/libsycl.so \
            lib/libur_adapter_opencl.so \
            lib/libur_adapter_level_zero.so \
            lib/libur_loader.so \
            lib/libze_loader.so.1.34.0 \
            lib/libze_tracing_layer.so.1.34.0 \
            lib/libze_validation_layer.so.1.34.0 \
            usr/bin/pw-play \
            usr/lib/x86_64-linux-gnu/intel-opencl/libigdrcl.so \
            usr/share/singstone/licenses/kb-whisper-small.LICENSE; do
            grep -Eq "squashfs-root/$payload(\\.|$)" <<<"$file_list"
          done

          installed_models=$(unsquashfs -cat "$snap_path" \
            usr/share/singstone/models.lock)
          jq -e '
            any(.models[];
              .purpose == "transcription"
              and .name == "kb-whisper-small-q5_0"
              and .filename == "kb-whisper-small-q5_0.bin"
              and .size == 175209680
              and .sha256 == "6768836a51abc902e420c613153e6d418c90ea2774e913274d02ab23170225b7")
            and any(.models[];
              .purpose == "transcription"
              and .name == "whisper-small-q5_1"
              and .filename == "ggml-small-q5_1.bin"
              and .size == 190085487
              and .sha256 == "ae85e4a935d7a567bd102fe55afc16bb595bdb618e11b2fc7591bc08120411bb")
          ' <<<"$installed_models"

          expanded_snap_yaml=$(unsquashfs -cat "$snap_path" meta/snap.yaml)
          ruby -ryaml -e '
            project = YAML.safe_load(STDIN.read, aliases: true)
            plugs = project.fetch("apps").fetch("singstone").fetch("plugs")
            abort "generated singstone app is missing opengl" unless plugs.include?("opengl")
            abort "generated singstone app is missing pipewire" unless plugs.include?("pipewire")
          ' <<<"$expanded_snap_yaml"

      - name: Smoke-test Level Zero loader ABI
        run: |
          set +e
          timeout 30 env \
            LD_LIBRARY_PATH="$PWD/prime/lib:$PWD/prime/lib/x86_64-linux-gnu:$PWD/prime/usr/lib/x86_64-linux-gnu" \
            ONEAPI_DEVICE_SELECTOR=level_zero:gpu \
            ./prime/bin/singstone-sycl-probe \
            >level-zero-probe.stdout \
            2>level-zero-probe.stderr
          probe_status=$?
          set -e
          cat level-zero-probe.stderr
          if (( probe_status > 1 )); then
            echo "Level Zero probe failed with status $probe_status" >&2
            exit 1
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: singstone-snap
          path: "*.snap"
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish latest main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - check
      - snap
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: singstone-snap
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: singstone-gnome-shell-extension
          path: dist

      - name: Prepare stable asset name
        run: |
          snap_path=$(find dist -maxdepth 1 -type f -name '*.snap' -print -quit)
          test -n "$snap_path"
          mv "$snap_path" dist/singstone_amd64.snap

      - name: Publish rolling release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; skipping this release."
            exit 0
          fi

          {
            printf 'Automated AMD64 Snap built from [`%s`](https://github.com/%s/commit/%s) on `main`.\n' \
              "${GITHUB_SHA::7}" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            cat <<'EOF'

          This rolling release is replaced after every successful `main` build.

          ## Install

          Requirements: AMD64 Linux, snapd 2.68 or newer, and PipeWire.

          ```bash
          curl -fLO https://github.com/nsg/singstone/releases/latest/download/singstone_amd64.snap
          sudo snap set system experimental.user-daemons=true
          sudo snap install --dangerous ./singstone_amd64.snap
          sudo snap connect singstone:opengl
          sudo snap connect singstone:pipewire
          snap connections singstone
          ```

          The package is unsigned, so local installation requires `--dangerous`.
          Singstone remains strictly confined. Model weights download and are
          verified automatically when you first run a model-backed command.

          ## GNOME top bar control (optional)

          Install the Shell extension, then log out and back in (Wayland cannot load a
          new extension into a running session):

              curl -fLO https://github.com/nsg/singstone/releases/latest/download/singstone-gnome-shell-extension.zip
              gnome-extensions install --force singstone-gnome-shell-extension.zip
              # log out and in again
              gnome-extensions enable singstone@nsg.github.io

          The top bar then shows a Record button; while recording it shows the elapsed
          time, live microphone and system-audio levels, and a stop button. Singstone
          must be installed; it is launched automatically if it is not running.
          The extension supports GNOME Shell 45 through 49.
          EOF
          } > release-notes.md

          # GitHub Releases require a tag. Reuse one fixed implementation tag;
          # the project does not create version tags or retain older releases.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest \
              dist/singstone_amd64.snap \
              dist/singstone-gnome-shell-extension.zip \
              --clobber
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
            gh release edit latest \
              --target "$GITHUB_SHA" \
              --title "Latest" \
              --notes-file release-notes.md \
              --latest
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" >/dev/null 2>&1; then
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
                -f sha="$GITHUB_SHA" \
                -F force=true >/dev/null
            else
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/latest" \
                -f sha="$GITHUB_SHA" >/dev/null
            fi
            gh release create latest \
              dist/singstone_amd64.snap \
              dist/singstone-gnome-shell-extension.zip \
              --verify-tag \
              --title "Latest" \
              --notes-file release-notes.md \
              --latest
          fi
