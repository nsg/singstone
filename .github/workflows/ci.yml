name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  check:
    name: Formatting and RustSec audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - run: cargo fmt --check

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install --locked cargo-audit

      - run: cargo audit

  snap:
    name: Build and inspect strict snap
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Install Snapcraft
        run: sudo snap install snapcraft --classic

      - name: Build source-pinned snap
        run: |
          sudo snapcraft pack --destructive-mode
          sudo chown "$USER:$USER" ./*.snap

      - name: Verify confinement declaration
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
          unsquashfs -cat ./*.snap meta/snap.yaml > built-snap.yaml
          grep -q '^confinement: strict$' built-snap.yaml
          grep -q '^  pipewire:$' built-snap.yaml
          grep -q '^  home:$' built-snap.yaml
          if grep -Eq '^  network(-bind)?:$|^      - network(-bind)?$' built-snap.yaml; then
            echo "The runtime snap unexpectedly declares network access" >&2
            exit 1
          fi

      - name: Review package
        run: |
          sudo snap install review-tools
          snap-review ./*.snap

      - name: Install and smoke test
        run: |
          sudo snap install --dangerous ./*.snap
          singstone --version
          singstone speakers

      - uses: actions/upload-artifact@v4
        with:
          name: singstone-snap
          path: "*.snap"
          if-no-files-found: error
          retention-days: 7
