name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Formatting and RustSec audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - run: cargo fmt --check

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install --locked cargo-audit

      - run: cargo audit

  snap:
    name: Build and inspect strict snap
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Snapcraft
        run: |
          for attempt in {1..10}; do
            if sudo snap install snapcraft --classic; then
              exit 0
            fi
            if (( attempt < 10 )); then
              echo "Snap Store unavailable (attempt $attempt of 10); retrying" >&2
              sleep 30
            fi
          done
          exit 1

      - name: Build source-pinned snap
        run: |
          sudo snapcraft pack --destructive-mode
          sudo chown "$USER:$USER" ./*.snap

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: singstone-snap
          path: "*.snap"
          if-no-files-found: error
          retention-days: 7

      - name: Verify package contents and confinement
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
          unsquashfs -cat ./*.snap meta/snap.yaml > built-snap.yaml
          ruby -ryaml -e '
            metadata = YAML.safe_load_file("built-snap.yaml", aliases: true)
            abort "snap is not strictly confined" unless metadata["confinement"] == "strict"
            main = metadata.dig("apps", "singstone") || abort("main app missing")
            setup = metadata.dig("apps", "model-setup") || abort("model setup service missing")
            plugs = Array(main["plugs"])
            abort "home plug is missing" unless plugs.include?("home")
            abort "pipewire plug is missing" unless plugs.include?("pipewire")
            forbidden = plugs & %w[network network-bind]
            abort "runtime network plug declared: #{forbidden.join(", ")}" unless forbidden.empty?
            abort "setup is not a simple user service" unless setup["daemon"] == "simple" && setup["daemon-scope"] == "user"
            abort "setup must start on demand" unless setup["install-mode"] == "disable"
            abort "setup must have only outbound network" unless Array(setup["plugs"]) == ["network"]
          '
          unsquashfs -l ./*.snap > snap-files.txt
          grep -q 'usr/share/singstone/models.lock$' snap-files.txt
          if grep -Eq '/(ggml-base\.en\.bin|model\.onnx|nemo_en_titanet_small\.onnx)$' snap-files.txt; then
            echo "model weights must not be bundled in the snap" >&2
            exit 1
          fi

      - name: Install and smoke test
        run: |
          sudo snap set system experimental.user-daemons=true
          sudo snap install --dangerous ./*.snap
          singstone --version
          singstone speakers

  release:
    name: Publish latest main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - check
      - snap
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: singstone-snap
          path: dist

      - name: Prepare stable asset name
        run: |
          snap_path=$(find dist -maxdepth 1 -type f -name '*.snap' -print -quit)
          test -n "$snap_path"
          mv "$snap_path" dist/singstone_amd64.snap

      - name: Publish rolling release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; skipping this release."
            exit 0
          fi

          {
            printf 'Automated AMD64 Snap built from [`%s`](https://github.com/%s/commit/%s) on `main`.\n' \
              "${GITHUB_SHA::7}" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            cat <<'EOF'

          This rolling release is replaced after every successful `main` build.

          ## Install

          Requirements: AMD64 Linux, snapd 2.68 or newer, and PipeWire.

          ```bash
          curl -fLO https://github.com/nsg/singstone/releases/latest/download/singstone_amd64.snap
          sudo snap set system experimental.user-daemons=true
          sudo snap install --dangerous ./singstone_amd64.snap
          sudo snap connect singstone:pipewire
          ```

          The package is unsigned, so local installation requires `--dangerous`.
          Singstone remains strictly confined. Model weights download and are
          verified automatically when you first run a model-backed command.
          EOF
          } > release-notes.md

          # GitHub Releases require a tag. Reuse one fixed implementation tag;
          # the project does not create version tags or retain older releases.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/singstone_amd64.snap --clobber
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
            gh release edit latest \
              --target "$GITHUB_SHA" \
              --title "Latest" \
              --notes-file release-notes.md \
              --latest
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" >/dev/null 2>&1; then
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
                -f sha="$GITHUB_SHA" \
                -F force=true >/dev/null
            else
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/latest" \
                -f sha="$GITHUB_SHA" >/dev/null
            fi
            gh release create latest dist/singstone_amd64.snap \
              --verify-tag \
              --title "Latest" \
              --notes-file release-notes.md \
              --latest
          fi
