name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Formatting and RustSec audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - run: cargo fmt --check

      - name: Install cargo-audit
        run: command -v cargo-audit >/dev/null || cargo install --locked cargo-audit

      - run: cargo audit

  snap:
    name: Build and inspect strict snap
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Snapcraft
        run: |
          for attempt in {1..10}; do
            if sudo snap install snapcraft --classic; then
              exit 0
            fi
            if (( attempt < 10 )); then
              echo "Snap Store unavailable (attempt $attempt of 10); retrying" >&2
              sleep 30
            fi
          done
          exit 1

      - name: Compute ONNX Runtime cache key
        id: onnxruntime-cache-key
        run: |
          recipe_hash=$(
            ruby -ryaml -rjson -rdigest -e '
              project = YAML.safe_load_file("snap/snapcraft.yaml", aliases: true)
              payload = {
                "base" => project.fetch("base"),
                "platforms" => project.fetch("platforms"),
                "part" => project.fetch("parts").fetch("onnxruntime"),
              }
              print Digest::SHA256.hexdigest(JSON.generate(payload))
            '
          )
          snapcraft_revision=$(snap list snapcraft | awk '$1 == "snapcraft" {print $3}')
          test -n "$recipe_hash"
          test -n "$snapcraft_revision"
          printf 'key=onnxruntime-build-v1-%s-%s-snapcraft-%s-%s\n' \
            '${{ runner.os }}' '${{ runner.arch }}' \
            "$snapcraft_revision" "$recipe_hash" >> "$GITHUB_OUTPUT"

      - name: Restore ONNX Runtime build cache
        id: onnxruntime-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            parts/onnxruntime/install
            parts/onnxruntime/state/pull
            parts/onnxruntime/state/build
          key: ${{ steps.onnxruntime-cache-key.outputs.key }}

      - name: Build ONNX Runtime
        run: sudo snapcraft build onnxruntime --destructive-mode

      - name: Validate ONNX Runtime cache payload
        run: |
          test -f parts/onnxruntime/install/lib/libonnxruntime.so.1.28.2
          test -f parts/onnxruntime/state/pull
          test -f parts/onnxruntime/state/build
          sudo chown -R "$USER:$USER" \
            parts/onnxruntime/install \
            parts/onnxruntime/state

      - name: Save ONNX Runtime build cache
        if: steps.onnxruntime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            parts/onnxruntime/install
            parts/onnxruntime/state/pull
            parts/onnxruntime/state/build
          key: ${{ steps.onnxruntime-cache-key.outputs.key }}

      - name: Build and pack remaining snap
        run: |
          sudo snapcraft pack --destructive-mode
          sudo chown "$USER:$USER" ./*.snap

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: singstone-snap
          path: "*.snap"
          if-no-files-found: error
          retention-days: 7

      - name: Verify package contents and confinement
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends squashfs-tools
          unsquashfs -cat ./*.snap meta/snap.yaml > built-snap.yaml
          ruby -ryaml -e '
            metadata = YAML.safe_load_file("built-snap.yaml", aliases: true)
            abort "snap is not strictly confined" unless metadata["confinement"] == "strict"
            abort "SNAP_UID support is not required" unless Array(metadata["assumes"]).include?("snap-uid-envvars")
            main = metadata.dig("apps", "singstone") || abort("main app missing")
            setup = metadata.dig("apps", "model-download") || abort("model download service missing")
            abort "obsolete model setup service remains" if metadata.dig("apps", "model-setup")
            environment = main["environment"] || abort("main app environment missing")
            abort "PipeWire runtime directory is wrong" unless environment["PIPEWIRE_RUNTIME_DIR"] == "/run/user/$SNAP_UID"
            abort "model setup socket path is wrong" unless environment["SINGSTONE_MODEL_SETUP_SOCKET"] == "$SNAP_USER_COMMON/model-setup.sock"
            plugs = Array(main["plugs"])
            abort "home plug is missing" unless plugs.include?("home")
            abort "pipewire plug is missing" unless plugs.include?("pipewire")
            abort "session D-Bus slot is missing from main app" unless Array(main["slots"]).include?("singstone-dbus")
            dbus = metadata.dig("slots", "singstone-dbus") || abort("session D-Bus slot missing")
            abort "session D-Bus slot has the wrong interface" unless dbus["interface"] == "dbus"
            abort "session D-Bus slot has the wrong bus" unless dbus["bus"] == "session"
            abort "session D-Bus slot has the wrong name" unless dbus["name"] == "io.github.nsg.Singstone"
            forbidden = plugs & %w[network network-bind]
            abort "runtime network plug declared: #{forbidden.join(", ")}" unless forbidden.empty?
            abort "download helper is not a simple user service" unless setup["daemon"] == "simple" && setup["daemon-scope"] == "user"
            abort "download helper lacks the GNOME runtime loader" unless setup["command-chain"] == ["snap/command-chain/desktop-launch"]
            abort "download helper socket is disabled" if setup["install-mode"] == "disable"
            socket = setup.dig("sockets", "activation") || abort("download helper activation socket missing")
            abort "download helper socket has the wrong path" unless socket["listen-stream"] == "$SNAP_USER_COMMON/model-setup.sock"
            abort "download helper socket is not private" unless socket["socket-mode"] == 384
            abort "download helper has the wrong plugs" unless Array(setup["plugs"]) == %w[network network-bind]
          '
          unsquashfs -l ./*.snap > snap-files.txt
          grep -q 'usr/share/pipewire/client.conf$' snap-files.txt
          grep -q 'usr/lib/x86_64-linux-gnu/pipewire-0.3/libpipewire-module-protocol-native.so$' snap-files.txt
          grep -q 'usr/share/singstone/models.lock$' snap-files.txt
          grep -q 'usr/lib/singstone/model-download-service$' snap-files.txt
          if grep -Eq '/(ggml-base\.en\.bin|model\.onnx|nemo_en_titanet_small\.onnx)$' snap-files.txt; then
            echo "model weights must not be bundled in the snap" >&2
            exit 1
          fi

      - name: Install, upgrade, and smoke test
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pipewire pipewire-bin wireplumber
          runtime_dir="/run/user/$(id -u)"
          sudo install -d -o "$USER" -g "$(id -gn)" -m 700 "$runtime_dir"
          export XDG_RUNTIME_DIR="$runtime_dir"
          source scripts/pw-headless.sh

          sudo snap set system experimental.user-daemons=true
          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            previous_snap="$RUNNER_TEMP/previous-singstone.snap"
            curl --fail --location --retry 3 \
              --output "$previous_snap" \
              "https://github.com/$GITHUB_REPOSITORY/releases/latest/download/singstone_amd64.snap"
            sudo snap install --dangerous "$previous_snap"
          fi
          sudo snap install --dangerous ./*.snap
          sudo snap connect singstone:pipewire
          singstone --version
          singstone speakers

          model_socket="$HOME/snap/singstone/common/model-setup.sock"
          for _ in {1..100}; do
            [[ -S "$model_socket" ]] && break
            sleep 0.1
          done
          test -S "$model_socket"
          singstone model-setup-check
          snap services --user singstone.model-download | grep -q 'socket-activated'
          test ! -e "$HOME/snap/singstone/common/models/.download-status.json"

          devices=$(singstone devices)
          grep -q 'test-sink' <<<"$devices"
          grep -q 'test-mic' <<<"$devices"

          sessions="$RUNNER_TEMP/singstone-sessions"
          mkdir -p "$sessions"
          singstone record \
            --mic none \
            --system test-sink \
            --output-dir "$sessions" &
          recorder_pid=$!
          manifest=""
          for _ in {1..100}; do
            manifest=$(find "$sessions" -name manifest.json -print -quit)
            [[ -n "$manifest" ]] && break
            sleep 0.1
          done
          test -n "$manifest"
          kill -TERM "$recorder_pid"
          wait "$recorder_pid"

          ruby -rjson -e '
            manifest_path = ARGV.fetch(0)
            manifest = JSON.parse(File.read(manifest_path))
            abort "recording was not finalized" unless manifest.fetch("state") == "stopped"
            audio = File.join(File.dirname(manifest_path), "audio/system.f32le")
            abort "recording contains no audio frames" unless File.size?(audio)
          ' "$manifest"

  release:
    name: Publish latest main build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - check
      - snap
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: singstone-snap
          path: dist

      - name: Prepare stable asset name
        run: |
          snap_path=$(find dist -maxdepth 1 -type f -name '*.snap' -print -quit)
          test -n "$snap_path"
          mv "$snap_path" dist/singstone_amd64.snap

      - name: Publish rolling release
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          current_main=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [[ "$current_main" != "$GITHUB_SHA" ]]; then
            echo "A newer main commit exists; skipping this release."
            exit 0
          fi

          {
            printf 'Automated AMD64 Snap built from [`%s`](https://github.com/%s/commit/%s) on `main`.\n' \
              "${GITHUB_SHA::7}" "$GITHUB_REPOSITORY" "$GITHUB_SHA"
            cat <<'EOF'

          This rolling release is replaced after every successful `main` build.

          ## Install

          Requirements: AMD64 Linux, snapd 2.68 or newer, and PipeWire.

          ```bash
          curl -fLO https://github.com/nsg/singstone/releases/latest/download/singstone_amd64.snap
          sudo snap set system experimental.user-daemons=true
          sudo snap install --dangerous ./singstone_amd64.snap
          sudo snap connect singstone:pipewire
          ```

          The package is unsigned, so local installation requires `--dangerous`.
          Singstone remains strictly confined. Model weights download and are
          verified automatically when you first run a model-backed command.
          EOF
          } > release-notes.md

          # GitHub Releases require a tag. Reuse one fixed implementation tag;
          # the project does not create version tags or retain older releases.
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest dist/singstone_amd64.snap --clobber
            gh api --method PATCH \
              "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
              -f sha="$GITHUB_SHA" \
              -F force=true >/dev/null
            gh release edit latest \
              --target "$GITHUB_SHA" \
              --title "Latest" \
              --notes-file release-notes.md \
              --latest
          else
            if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/latest" >/dev/null 2>&1; then
              gh api --method PATCH \
                "repos/$GITHUB_REPOSITORY/git/refs/tags/latest" \
                -f sha="$GITHUB_SHA" \
                -F force=true >/dev/null
            else
              gh api --method POST \
                "repos/$GITHUB_REPOSITORY/git/refs" \
                -f ref="refs/tags/latest" \
                -f sha="$GITHUB_SHA" >/dev/null
            fi
            gh release create latest dist/singstone_amd64.snap \
              --verify-tag \
              --title "Latest" \
              --notes-file release-notes.md \
              --latest
          fi
