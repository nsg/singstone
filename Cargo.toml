[package]
name = "singstone"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Local-only meeting recorder, transcriber and speaker diarizer for Linux/PipeWire"

[dependencies]
clap = { version = "4.6", features = ["derive", "env"] }
crossbeam-queue = "0.3"
pipewire = { version = "0.10", features = ["v1_0_0"] }
rustix = { version = "1", features = ["fs", "event", "time", "process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sherpa-onnx = { version = "1.13.8", default-features = false, features = ["shared"] }
whisper-rs = "0.16"

[features]
default = []
vulkan = ["whisper-rs/vulkan"]
intel-sycl = ["whisper-rs/intel-sycl"]
openblas = ["whisper-rs/openblas"]

# Native inference code is unusable at opt-level 0; keep our own crate debuggable
# but build dependencies (whisper.cpp, ggml, bindings) optimized.
[profile.dev.package."*"]
opt-level = 3

[patch.crates-io]
sherpa-onnx-sys = { path = "vendor/sherpa-onnx-sys" }
