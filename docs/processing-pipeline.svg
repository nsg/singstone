<svg xmlns="http://www.w3.org/2000/svg" width="720" height="1080" viewBox="0 0 720 1080" role="img" aria-labelledby="title description">
  <title id="title">Singstone processing pipeline</title>
  <desc id="description">A top-to-bottom flow from session inputs through transcribe, diarize, recognize, and render to the final transcript.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
  </defs>

  <rect width="720" height="1080" rx="20" fill="#f8fafc"/>
  <text x="360" y="45" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#0f172a">Processing pipeline</text>
  <text x="360" y="70" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">Persistent artifacts make every stage inspectable and independently repeatable</text>

  <!-- Session inputs -->
  <g filter="url(#shadow)">
    <rect x="70" y="100" width="580" height="92" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  </g>
  <text x="95" y="130" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#334155">SESSION INPUTS</text>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#334155">
    <rect x="95" y="146" width="148" height="28" rx="14" fill="#e2e8f0"/>
    <text x="169" y="165" text-anchor="middle">manifest.json</text>
    <rect x="256" y="146" width="190" height="28" rx="14" fill="#e2e8f0"/>
    <text x="351" y="165" text-anchor="middle">mic + system audio</text>
    <rect x="459" y="146" width="166" height="28" rx="14" fill="#e2e8f0"/>
    <text x="542" y="165" text-anchor="middle">models + speakers DB</text>
  </g>

  <path d="M 360 192 L 360 222" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 70 146 L 38 146 L 38 500 L 68 500" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 625 350 L 682 350 L 682 900 L 652 900" fill="none" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M 95 545 L 52 545 L 52 920 L 68 920" fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Transcribe -->
  <g filter="url(#shadow)">
    <rect x="70" y="230" width="580" height="150" rx="16" fill="#ffffff" stroke="#38bdf8" stroke-width="2"/>
  </g>
  <circle cx="105" cy="266" r="20" fill="#0284c7"/>
  <text x="105" y="272" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ffffff">1</text>
  <text x="140" y="263" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#0f172a">transcribe</text>
  <text x="140" y="286" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">Energy VAD → Whisper → timed words</text>
  <text x="95" y="322" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#334155">Uses raw audio and a Whisper GGML model</text>
  <rect x="95" y="337" width="530" height="27" rx="7" fill="#e0f2fe"/>
  <text x="360" y="356" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#075985">words.jsonl + words.meta.json</text>

  <rect x="228" y="391" width="264" height="26" rx="13" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text x="360" y="408" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="12" font-weight="600" fill="#475569">Stages 1 and 2 are independent</text>

  <!-- Diarize -->
  <g filter="url(#shadow)">
    <rect x="70" y="425" width="580" height="150" rx="16" fill="#ffffff" stroke="#a78bfa" stroke-width="2"/>
  </g>
  <circle cx="105" cy="461" r="20" fill="#7c3aed"/>
  <text x="105" y="467" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ffffff">2</text>
  <text x="140" y="458" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#0f172a">diarize</text>
  <text x="140" y="481" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">Segment speech → embed voices → cluster speakers</text>
  <text x="95" y="517" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#334155">Uses raw audio, pyannote segmentation, and speaker embeddings</text>
  <rect x="95" y="532" width="530" height="27" rx="7" fill="#ede9fe"/>
  <text x="360" y="551" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#5b21b6">diarization.jsonl + diarization.meta.json</text>

  <path d="M 360 575 L 360 615" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Recognize -->
  <g filter="url(#shadow)">
    <rect x="70" y="625" width="580" height="150" rx="16" fill="#ffffff" stroke="#f59e0b" stroke-width="2"/>
  </g>
  <circle cx="105" cy="661" r="20" fill="#d97706"/>
  <text x="105" y="667" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ffffff">3</text>
  <text x="140" y="658" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#0f172a">recognize</text>
  <text x="140" y="681" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">Compare cluster embeddings with enrolled speakers</text>
  <text x="95" y="717" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#334155">Uses diarization, raw audio, a matching embedding model, and speakers DB</text>
  <rect x="95" y="732" width="530" height="27" rx="7" fill="#fef3c7"/>
  <text x="360" y="751" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#92400e">speaker-assignments.json · optional</text>

  <path d="M 360 775 L 360 815" stroke="#64748b" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <!-- Render -->
  <g filter="url(#shadow)">
    <rect x="70" y="825" width="580" height="150" rx="16" fill="#ffffff" stroke="#34d399" stroke-width="2"/>
  </g>
  <circle cx="105" cy="861" r="20" fill="#059669"/>
  <text x="105" y="867" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#ffffff">4</text>
  <text x="140" y="858" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="19" font-weight="700" fill="#0f172a">render</text>
  <text x="140" y="881" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#475569">Join words with speaker intervals and optional names</text>
  <text x="95" y="917" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13" fill="#334155">Uses the three artifacts above · no ML model</text>
  <rect x="95" y="932" width="530" height="27" rx="7" fill="#d1fae5"/>
  <text x="360" y="951" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" font-weight="600" fill="#065f46">transcript.jsonl + transcript.txt</text>

  <path d="M 360 975 L 360 1005" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <rect x="170" y="1013" width="380" height="45" rx="22" fill="#0f172a"/>
  <text x="360" y="1041" text-anchor="middle" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#ffffff">FINAL, SPEAKER-LABELED TRANSCRIPT</text>
</svg>
