name: singstone
title: Singstone
version: "0.1.0"
base: core24
grade: stable
confinement: strict
assumes:
  - snapd2.68
  - snap-uid-envvars
platforms:
  amd64:

package-repositories:
  - type: apt
    url: https://apt.repos.intel.com/oneapi
    suites:
      - all
    components:
      - main
    formats:
      - deb
    architectures:
      - amd64
    key-id: E9BF0AFC46D6E8B7DA5882F1BAC6F0C353D04109

website: https://github.com/nsg/singstone
source-code: https://github.com/nsg/singstone
issues: https://github.com/nsg/singstone/issues
contact: https://github.com/nsg/singstone/issues
license: MIT
summary: Local meeting recorder, transcriber, and speaker diarizer
description: |
  Singstone records microphone and system audio through PipeWire, optionally
  collects screenshots, and creates timestamped, speaker-attributed
  transcripts. Recording and machine-learning inference run locally.

slots:
  singstone-dbus:
    interface: dbus
    bus: session
    name: io.github.nsg.Singstone

apps:
  singstone:
    command: bin/singstone-launcher
    desktop: usr/share/applications/io.github.nsg.Singstone.desktop
    extensions:
      - gnome
    environment:
      LD_LIBRARY_PATH: $SNAP/lib:$SNAP/usr/lib/x86_64-linux-gnu
      SPA_PLUGIN_DIR: $SNAP/usr/lib/x86_64-linux-gnu/spa-0.2
      PIPEWIRE_CONFIG_DIR: $SNAP/usr/share/pipewire
      PIPEWIRE_MODULE_DIR: $SNAP/usr/lib/x86_64-linux-gnu/pipewire-0.3
      PIPEWIRE_RUNTIME_DIR: /run/user/$SNAP_UID
      SINGSTONE_WHISPER_MODEL: $SNAP_USER_COMMON/models/kb-whisper-small-q5_0.bin
      SINGSTONE_WHISPER_LANGUAGE: sv
      SINGSTONE_SEGMENTATION_MODEL: $SNAP_USER_COMMON/models/model.onnx
      SINGSTONE_EMBEDDING_MODEL: $SNAP_USER_COMMON/models/nemo_en_titanet_small.onnx
      SINGSTONE_MODELS_LOCK: $SNAP/usr/share/singstone/models.lock
      SINGSTONE_MODELS_DIR: $SNAP_USER_COMMON/models
      SINGSTONE_MODEL_SETUP_SOCKET: $SNAP_USER_COMMON/model-setup.sock
      SINGSTONE_SPEAKERS_DB: $SNAP_USER_COMMON/speakers.json
    plugs:
      - home
      # Required for /dev/dri render nodes. The GNOME extension currently
      # contributes this plug too, but keep the GPU requirement explicit.
      - opengl
      - pipewire
    slots:
      - singstone-dbus
  model-download:
    command: usr/lib/singstone/model-download-service
    command-chain:
      - snap/command-chain/gpu-2404-wrapper
      - snap/command-chain/desktop-launch
    daemon: simple
    daemon-scope: user
    restart-condition: never
    sockets:
      activation:
        listen-stream: $SNAP_USER_COMMON/model-setup.sock
        socket-mode: 384
    environment:
      LD_LIBRARY_PATH: $SNAP/lib:$SNAP/usr/lib/x86_64-linux-gnu
      SINGSTONE_MODELS_LOCK: $SNAP/usr/share/singstone/models.lock
      SINGSTONE_MODELS_DIR: $SNAP_USER_COMMON/models
      SINGSTONE_MODEL_SETUP_SOCKET: $SNAP_USER_COMMON/model-setup.sock
    plugs:
      - network
      - network-bind

parts:
  # Ubuntu 24.04 ships Level Zero loader 1.16.1. Its private tracing ABI is
  # incompatible with the static Level Zero client in oneAPI 2026: the client
  # passes one DDI table while the old loader writes through three arguments.
  # Build the 1.34 loader and its tracing/validation layers as one matched set.
  # Keeping only the new loader beside Noble's 1.16 layers makes oneAPI 2026
  # reject the old tracing DDI during enumeration. Keep the matched set in
  # /lib, ahead of the distro copies in LD_LIBRARY_PATH.
  level-zero-loader:
    plugin: nil
    source: https://github.com/oneapi-src/level-zero.git
    source-type: git
    source-commit: 934714b278f850d164627eeaaa043eee02785a9e
    build-packages:
      - build-essential
      - cmake
      - ninja-build
    override-build: |
      cmake \
        -S "$CRAFT_PART_SRC" \
        -B "$CRAFT_PART_BUILD/loader-build" \
        -G Ninja \
        -DCMAKE_BUILD_TYPE=Release \
        -DBUILD_L0_LOADER_TESTS=OFF
      cmake --build "$CRAFT_PART_BUILD/loader-build" \
        --target ze_loader ze_tracing_layer ze_validation_layer \
        --parallel "$CRAFT_PARALLEL_BUILD_COUNT"
      mkdir -p \
        "$CRAFT_PART_INSTALL/lib" \
        "$CRAFT_PART_INSTALL/usr/share/doc/singstone"
      cp -a "$CRAFT_PART_BUILD/loader-build/lib/libze_loader.so"* \
        "$CRAFT_PART_INSTALL/lib/"
      cp -a "$CRAFT_PART_BUILD/loader-build/lib/libze_tracing_layer.so"* \
        "$CRAFT_PART_INSTALL/lib/"
      cp -a "$CRAFT_PART_BUILD/loader-build/lib/libze_validation_layer.so"* \
        "$CRAFT_PART_INSTALL/lib/"
      install -Dm644 "$CRAFT_PART_SRC/LICENSE" \
        "$CRAFT_PART_INSTALL/usr/share/doc/singstone/level-zero-LICENSE"

  onnxruntime:
    plugin: nil
    source: https://github.com/microsoft/onnxruntime.git
    source-type: git
    source-commit: 33ca9628233dc8f002435e868d4c2e9f82766ca1
    build-packages:
      - build-essential
      - ca-certificates
      - cmake
      - git
      - ninja-build
      - python3
      - python3-dev
      - python3-pip
    build-environment:
      - PIP_BREAK_SYSTEM_PACKAGES: "1"
    override-build: |
      ./build.sh \
        --config Release \
        --build_shared_lib \
        --allow_running_as_root \
        --compile_no_warning_as_error \
        --parallel "$CRAFT_PARALLEL_BUILD_COUNT" \
        --skip_tests \
        --target onnxruntime \
        --cmake_extra_defines \
          CMAKE_INSTALL_PREFIX="$CRAFT_PART_INSTALL" \
          CMAKE_INSTALL_LIBDIR=lib
      install -Dm755 build/Linux/Release/libonnxruntime.so.1.28.2 \
        "$CRAFT_PART_INSTALL/lib/libonnxruntime.so.1.28.2"
      ln -s libonnxruntime.so.1.28.2 "$CRAFT_PART_INSTALL/lib/libonnxruntime.so.1"
      ln -s libonnxruntime.so.1 "$CRAFT_PART_INSTALL/lib/libonnxruntime.so"
      mkdir -p "$CRAFT_PART_INSTALL/include/onnxruntime"
      cp include/onnxruntime/core/session/onnxruntime_*.h \
        "$CRAFT_PART_INSTALL/include/onnxruntime/"
      cp include/onnxruntime/core/session/onnxruntime_*.inc \
        "$CRAFT_PART_INSTALL/include/onnxruntime/"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/usr/share/doc/singstone/onnxruntime-LICENSE"
      install -Dm644 ThirdPartyNotices.txt \
        "$CRAFT_PART_INSTALL/usr/share/doc/singstone/onnxruntime-ThirdPartyNotices.txt"

  sherpa-onnx:
    after:
      - onnxruntime
    plugin: cmake
    source: https://github.com/k2-fsa/sherpa-onnx.git
    source-type: git
    source-commit: 11afbd009a7f8c08f4bcf2fc1b265d0df4670fbf
    build-packages:
      - build-essential
      - ca-certificates
      - git
    build-environment:
      - SHERPA_ONNXRUNTIME_INCLUDE_DIR: $CRAFT_STAGE/include/onnxruntime
      - SHERPA_ONNXRUNTIME_LIB_DIR: $CRAFT_STAGE/lib
      - LD_LIBRARY_PATH: $CRAFT_STAGE/lib
    cmake-parameters:
      - -DCMAKE_INSTALL_PREFIX=/
      - -DBUILD_SHARED_LIBS=ON
      - -DSHERPA_ONNX_BUILD_C_API_EXAMPLES=OFF
      - -DSHERPA_ONNX_ENABLE_BINARY=OFF
      - -DSHERPA_ONNX_ENABLE_C_API=ON
      - -DSHERPA_ONNX_ENABLE_CHECK=OFF
      - -DSHERPA_ONNX_ENABLE_JNI=OFF
      - -DSHERPA_ONNX_ENABLE_PORTAUDIO=OFF
      - -DSHERPA_ONNX_ENABLE_PYTHON=OFF
      - -DSHERPA_ONNX_ENABLE_SPEAKER_DIARIZATION=ON
      - -DSHERPA_ONNX_ENABLE_TESTS=OFF
      - -DSHERPA_ONNX_ENABLE_TTS=OFF
      - -DSHERPA_ONNX_ENABLE_WEBSOCKET=OFF
      - -DSHERPA_ONNX_USE_PRE_INSTALLED_ONNXRUNTIME_IF_AVAILABLE=ON
    override-build: |
      craftctl default
      rm -f "$CRAFT_PART_INSTALL"/lib/libonnxruntime.so*
      rm -f "$CRAFT_PART_INSTALL"/lib/libsherpa-onnx-cxx-api.so*
      install -Dm644 "$CRAFT_PART_SRC/LICENSE" \
        "$CRAFT_PART_INSTALL/usr/share/doc/singstone/sherpa-onnx-LICENSE"

  singstone:
    after:
      - level-zero-loader
      - sherpa-onnx
    plugin: rust
    source: .
    rust-channel: "1.98.1"
    build-snaps:
      - rustup/latest/stable
    build-packages:
      - clang
      - cmake
      - intel-oneapi-compiler-dpcpp-cpp-2026.1
      - intel-oneapi-mkl-sycl-devel-2026.1
      - libclang-dev
      - libpipewire-0.3-dev
      - libspa-0.2-dev
      - patch
      - pkg-config
    stage-packages:
      - bzip2
      - ca-certificates
      - curl
      - intel-opencl-icd
      - libze-intel-gpu1
      - libze1
      - libpipewire-0.3-0t64
      - libspa-0.2-modules
      - pipewire-bin
      - tar
    build-environment:
      - SHERPA_ONNX_LIB_DIR: $CRAFT_STAGE/lib
      - LD_LIBRARY_PATH: $CRAFT_STAGE/lib
    override-build: |
      cargo clippy --release --all-targets --locked -- -D warnings
      cargo test --release --locked
      craftctl default
      set +u
      . /opt/intel/oneapi/setvars.sh --force
      set -u
      mapfile -t whisper_sys_dirs < <(
        find "${CARGO_HOME:-/root/.cargo}/registry/src" \
          -type d -name 'whisper-rs-sys-0.15.0' -print
      )
      if (( ${#whisper_sys_dirs[@]} != 1 )); then
        echo "expected one whisper-rs-sys 0.15.0 source, found ${#whisper_sys_dirs[@]}" >&2
        exit 1
      fi
      patch --directory="${whisper_sys_dirs[0]}" --strip=1 \
        < snap/local/whisper-sycl-oneapi-2026.patch
      icpx -fsycl -O2 snap/local/sycl-probe.cpp \
        -o "$CRAFT_PART_INSTALL/bin/singstone-sycl-probe"
      GGML_SYCL_F16=ON \
        CARGO_TARGET_DIR="$CRAFT_PART_BUILD/target-sycl" \
        cargo build --release --locked --features intel-sycl
      install -Dm755 "$CRAFT_PART_BUILD/target-sycl/release/singstone" \
        "$CRAFT_PART_INSTALL/bin/singstone-sycl"
      install -Dm755 snap/local/singstone-launcher \
        "$CRAFT_PART_INSTALL/bin/singstone-launcher"
      mapfile -t sycl_native_dirs < <(
        find "$CRAFT_PART_BUILD/target-sycl/release/build" \
          -type f -path '*/out/lib/libggml-sycl.so.*' -printf '%h\n' \
          | sort -u
      )
      if (( ${#sycl_native_dirs[@]} != 1 )); then
        echo "expected one SYCL native library directory, found ${#sycl_native_dirs[@]}" >&2
        exit 1
      fi
      sycl_native_dir=${sycl_native_dirs[0]}
      mkdir -p "$CRAFT_PART_INSTALL/lib"
      cp -a "$sycl_native_dir"/libggml*.so* \
        "$sycl_native_dir"/libwhisper.so* \
        "$CRAFT_PART_INSTALL/lib/"
      LD_LIBRARY_PATH="$CRAFT_PART_INSTALL/lib:$LD_LIBRARY_PATH" \
        snap/local/install-sycl-runtime "$CRAFT_PART_INSTALL/lib" \
        "$CRAFT_PART_INSTALL/bin/singstone-sycl-probe" \
        "$CRAFT_PART_INSTALL/lib/libggml-sycl.so"
      mkdir -p "$CRAFT_PART_INSTALL/usr/share/doc/singstone"
      if [ -d /opt/intel/oneapi/licensing ]; then
        cp -a /opt/intel/oneapi/licensing \
          "$CRAFT_PART_INSTALL/usr/share/doc/singstone/oneapi-licensing"
      fi
      if [ -d /opt/intel/oneapi/mkl/latest/share/doc/mkl/licensing ]; then
        cp -a /opt/intel/oneapi/mkl/latest/share/doc/mkl/licensing \
          "$CRAFT_PART_INSTALL/usr/share/doc/singstone/onemkl-licensing"
      fi
      install -Dm644 docs/models.lock \
        "$CRAFT_PART_INSTALL/usr/share/singstone/models.lock"
      install -Dm644 snap/gui/io.github.nsg.Singstone.desktop \
        "$CRAFT_PART_INSTALL/usr/share/applications/io.github.nsg.Singstone.desktop"
      install -Dm644 LICENSE "$CRAFT_PART_INSTALL/usr/share/doc/singstone/LICENSE"
      install -Dm644 snap/local/THIRD_PARTY.md \
        "$CRAFT_PART_INSTALL/usr/share/doc/singstone/THIRD_PARTY.md"
      install -Dm755 snap/local/model-download-service \
        "$CRAFT_PART_INSTALL/usr/lib/singstone/model-download-service"
      install -Dm644 snap/local/licenses/pyannote-segmentation.LICENSE \
        "$CRAFT_PART_INSTALL/usr/share/singstone/licenses/pyannote-segmentation.LICENSE"
      install -Dm644 snap/local/licenses/kb-whisper-small.LICENSE \
        "$CRAFT_PART_INSTALL/usr/share/singstone/licenses/kb-whisper-small.LICENSE"
